    RewriteInput:
      type: object
      required: [content, tone]
      properties:
        content:
          type: string
        tone:
          type: string
          enum: [professional, funny, marketing, corporate, friendly]
        platform:
          type: string

    ImageGenerateInput:
      type: object
      required: [prompt, style]
      properties:
        prompt:
