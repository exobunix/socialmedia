        clientId:
          type: ["string", "null"]
        redirectUri:
          type: ["string", "null"]
        scopes:
          type: ["string", "null"]
        environment:
          type: string
          enum: [production, sandbox]
        isEnabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    PlatformConfigInput:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
        redirectUri:
          type: string
        scopes:
          type: string
        webhookSecret:
          type: string
        environment:
          type: string
          enum: [production, sandbox]
        isEnabled:
          type: boolean
