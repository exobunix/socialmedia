        totalRevenue:
          type: number
        totalSubscriptions:
          type: integer
        connectedAccounts:
          type: integer
        scheduledPosts:
          type: integer
        publishedPosts:
          type: integer
        failedPosts:
          type: integer
        aiRequests:
          type: integer
        storageUsedMb:
          type: number
        newUsersToday:
          type: integer
        newUsersThisWeek:
          type: integer
        revenueThisMonth:
          type: number

    AdminUser:
      type: object
