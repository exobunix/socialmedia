    AiGenerationLog:
      type: object
      required: [id, userId, type, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [caption, hashtags, rewrite, image]
        prompt:
          type: ["string", "null"]
        result:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ─── ADMIN SCHEMAS ─────────────────────────────────────────────────────────
    AdminStats:
      type: object
      required: [totalUsers, activeUsers, totalRevenue, totalSubscriptions, connectedAccounts, scheduledPosts, publishedPosts, failedPosts, aiRequests]
      properties:
