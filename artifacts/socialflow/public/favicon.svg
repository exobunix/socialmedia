<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="glyph-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bg-grad)" />
  
  <!-- A beautiful flowing symbol: Two interlocking loops/waves representing connection/flow & AI -->
  <g transform="translate(10, 10)">
    <!-- Outer accent glow ring -->
    <rect x="10" y="10" width="140" height="140" rx="30" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />
    
    <!-- Flow loop -->
    <path d="M45 100 C 45 70, 70 45, 100 45 C 125 45, 135 60, 135 75 C 135 95, 115 105, 95 105 C 75 105, 60 115, 60 130 C 60 140, 70 145, 80 145 C 105 145, 125 125, 125 100" stroke="url(#glyph-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Sparkle/AI icon in upper right -->
    <path d="M110 50 L113 42 L116 50 L124 53 L116 56 L113 64 L110 56 L102 53 Z" fill="#67e8f9" />
  </g>
</svg>
